[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-signals"
version = "0.1.0"
description = "Trading signals system for stocks and options — built by JARVIS"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "ta>=0.11",           # Technical analysis indicators
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
