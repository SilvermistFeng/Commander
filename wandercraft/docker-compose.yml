services:
  db:
    image: postgres:16-alpine
    container_name: wandercraft-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wandercraft
      POSTGRES_PASSWORD: wandercraft
      POSTGRES_DB: wandercraft
    ports:
      - "5432:5432"
    volumes:
      - wandercraft-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wandercraft -d wandercraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wandercraft-pgdata:
