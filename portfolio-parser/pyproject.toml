[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-parser"
version = "0.1.0"
description = "Natural-language financial transaction parser — turns trade logs into validated JSON. Built by JARVIS."
requires-python = ">=3.10"
dependencies = []          # Deliberately zero runtime deps: pure standard library.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
parse-transaction = "portfolio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
